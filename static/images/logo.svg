<svg width="520" height="120" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="devconnect logo">
  <defs>
    <style>
      .word { fill:#E6E7FF; font-family: Nunito, "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .icon-fill { fill:#7A7FD6; }
      .icon-stroke { stroke:#7A7FD6; stroke-width:8; stroke-linecap:round; }
    </style>
  </defs>

  <!-- word (before the icon) -->
  <text class="word" x="10" y="84" font-size="72" letter-spacing="2">devc</text>

  <!-- magnifying-glass as 'o', placed flush with 'c' -->
  <circle cx="225" cy="60" r="26" class="icon-fill"></circle>
  <circle cx="225" cy="60" r="18" fill="none" class="icon-stroke"></circle>
  <line x1="245" y1="78" x2="261" y2="94" class="icon-stroke"></line>

  <!-- remaining text -->
  <text class="word" x="270" y="84" font-size="72" letter-spacing="2">nnect</text>
</svg>
